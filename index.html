<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>台股費波那契工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Share+Tech+Mono&display=swap');
  :root{--bg:#0a0e1a;--panel:#0f1628;--border:#1e2d4a;--accent:#00d4ff;--accent2:#ff6b35;--up:#ef5350;--down:#26a69a;--yellow:#ffd700;--text:#c8d8f0;--text-dim:#5a7a9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
  .container{max-width:900px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#0066ff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 16px rgba(0,212,255,0.3);flex-shrink:0;}
  h1{font-size:17px;font-weight:700;color:#fff;}
  .subtitle{font-size:10px;color:var(--text-dim);font-family:'Share Tech Mono',monospace;margin-top:2px;}
  .updated-badge{margin-left:auto;font-size:10px;font-family:'Share Tech Mono',monospace;color:var(--down);background:rgba(38,166,154,0.1);border:1px solid rgba(38,166,154,0.2);padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{flex:1;padding:9px 4px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text-dim);font-size:12px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all 0.2s;text-align:center;}
  .tab.active{background:rgba(0,212,255,0.1);border-color:var(--accent);color:var(--accent);}
  .tab-content{display:none;}.tab-content.active{display:block;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .panel-title{font-size:10px;font-family:'Share Tech Mono',monospace;color:var(--accent);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase;}
  .input-row{display:flex;gap:8px;}
  input[type="text"],input[type="number"]{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:15px;font-family:'Share Tech Mono',monospace;outline:none;transition:border-color 0.2s;width:100%;}
  input:focus{border-color:var(--accent);}
  .btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.2s;white-space:nowrap;font-family:'Noto Sans TC',sans-serif;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#0066ff);color:#fff;box-shadow:0 4px 16px rgba(0,212,255,0.2);}
  .btn-full{width:100%;margin-top:14px;padding:12px;}
  .field{margin-bottom:12px;}
  label.field-label{display:block;font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase;}
  .filters-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .fib-checks{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;}
  .fib-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);font-size:11px;font-family:'Share Tech Mono',monospace;color:var(--text-dim);background:transparent;cursor:pointer;transition:all 0.2s;user-select:none;}
  .fib-btn.on{background:rgba(0,212,255,0.12);border-color:var(--accent);color:var(--accent);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;}
  .toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
  .toggle input{display:none;}
  .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:background 0.3s;}
  .toggle-slider::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform 0.3s;}
  .toggle input:checked+.toggle-slider{background:var(--accent);}
  .toggle input:checked+.toggle-slider::after{transform:translateX(18px);}
  /* 股票標頭 */
  .stock-header{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .stock-header.show{display:block;}
  .sh-top{display:flex;align-items:flex-start;gap:12px;}
  .sh-left{flex:1;}
  .sh-code{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:#fff;}
  .sh-name{font-size:14px;color:var(--accent);margin-top:2px;}
  .sh-right{text-align:right;}
  .sh-price{font-family:'Share Tech Mono',monospace;font-size:26px;font-weight:700;color:#fff;}
  .sh-change{font-family:'Share Tech Mono',monospace;font-size:13px;}
  .sh-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .kd-badge{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .badge{font-size:11px;font-family:'Share Tech Mono',monospace;padding:3px 10px;border-radius:12px;}
  .badge-kd{background:rgba(90,122,154,0.2);border:1px solid rgba(90,122,154,0.3);color:var(--text-dim);}
  .badge-kd-low{background:rgba(239,83,80,0.15);border:1px solid rgba(239,83,80,0.3);color:var(--up);}
  .badge-golden{background:rgba(255,215,0,0.15);border:1px solid rgba(255,215,0,0.4);color:var(--yellow);font-weight:700;}
  .badge-death{background:rgba(90,90,90,0.2);border:1px solid rgba(90,90,90,0.3);color:#888;}
  .fav-btn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans TC',sans-serif;}
  .fav-btn.active{border-color:var(--yellow);color:var(--yellow);}
  .up{color:var(--up);}.down{color:var(--down);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .chart-wrap{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .chart-wrap.show{display:block;animation:fadeIn 0.3s ease;}
  .chart-title{font-size:10px;font-family:'Share Tech Mono',monospace;color:var(--text-dim);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}
  canvas{display:block;width:100%;border-radius:6px;}
  .fib-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .fib-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-family:'Share Tech Mono',monospace;min-width:110px;}
  .fib-legend-line{width:18px;height:2px;border-radius:1px;flex-shrink:0;}
  .fib-legend-val{color:var(--text-dim);}
  .analysis-box{display:none;background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.12);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.8;color:var(--text);}
  .analysis-box.show{display:block;}
  .stats-row{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
  .stats-row.show{display:grid;grid-template-columns:repeat(4,1fr);}
  .stat-item{padding:12px 8px;text-align:center;border-right:1px solid var(--border);}
  .stat-item:last-child{border-right:none;}
  .stat-label{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
  .stat-val{font-family:'Share Tech Mono',monospace;font-size:13px;color:#fff;font-weight:700;}
  .error-msg{display:none;padding:12px 14px;background:rgba(239,83,80,0.08);border:1px solid rgba(239,83,80,0.2);border-radius:10px;font-size:13px;color:var(--up);margin-top:10px;}
  .error-msg.show{display:block;}
  /* 最愛 */
  .fav-list{display:flex;flex-wrap:wrap;gap:8px;}
  .fav-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;}
  .fav-chip-code{font-family:'Share Tech Mono',monospace;color:var(--accent);}
  .fav-chip-name{color:var(--text-dim);}
  .fav-chip-del{color:var(--text-dim);font-size:15px;margin-left:2px;}
  .fav-empty{font-size:13px;color:var(--text-dim);padding:8px 0;}
  /* 篩選 */
  .screener-results{display:none;}.screener-results.show{display:block;}
  .results-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .results-label{font-size:10px;font-family:'Share Tech Mono',monospace;color:var(--accent);letter-spacing:2px;text-transform:uppercase;}
  .results-count{font-size:11px;font-family:'Share Tech Mono',monospace;color:var(--text-dim);}
  .results-count span{color:var(--yellow);}
  .screener-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;animation:fadeIn 0.3s ease forwards;opacity:0;cursor:pointer;transition:border-color 0.2s;}
  .screener-card:hover{border-color:rgba(0,212,255,0.3);}
  .sc-top{display:flex;align-items:center;gap:10px;}
  .sc-code{font-family:'Share Tech Mono',monospace;font-size:16px;font-weight:700;color:#fff;min-width:50px;}
  .sc-info{flex:1;}
  .sc-name{font-size:13px;color:var(--accent);margin-bottom:3px;}
  .sc-tags{display:flex;gap:5px;flex-wrap:wrap;}
  .tag{font-size:10px;font-family:'Share Tech Mono',monospace;padding:2px 7px;border-radius:8px;}
  .tag-fib{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);color:var(--accent);}
  .tag-kd{background:rgba(239,83,80,0.1);border:1px solid rgba(239,83,80,0.2);color:var(--up);}
  .tag-golden{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);color:var(--yellow);}
  .sc-price{text-align:right;}
  .sc-price-val{font-family:'Share Tech Mono',monospace;font-size:16px;color:#fff;font-weight:700;}
  .sc-change{font-family:'Share Tech Mono',monospace;font-size:11px;margin-top:2px;}
  .disclaimer{margin-top:14px;padding:11px 14px;background:rgba(255,107,53,0.06);border:1px solid rgba(255,107,53,0.15);border-radius:10px;font-size:10px;color:var(--text-dim);line-height:1.7;}
  .disclaimer strong{color:var(--accent2);}
  .no-data{text-align:center;padding:32px;color:var(--text-dim);font-size:14px;}
  @media(max-width:480px){.filters-grid{grid-template-columns:1fr;}.stats-row.show{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">📈</div>
    <div>
      <h1>台股費波那契工具</h1>
      <div class="subtitle">REAL DATA · TWSE · GITHUB PAGES</div>
    </div>
    <div class="updated-badge" id="updatedBadge">載入中...</div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('lookup')">🕯 K線查詢</button>
    <button class="tab" onclick="switchTab('screener')">📊 篩選器</button>
    <button class="tab" onclick="switchTab('favtab')">⭐ 最愛</button>
  </div>

  <!-- TAB 1 -->
  <div class="tab-content active" id="tab-lookup">
    <div class="panel">
      <div class="panel-title">▸ 輸入股票代碼</div>
      <div class="input-row">
        <input type="text" id="stockCode" placeholder="例：2330、0050、1583" maxlength="6" onkeydown="if(event.key==='Enter') lookupStock()">
        <button class="btn btn-primary" onclick="lookupStock()">查詢</button>
      </div>
    </div>
    <div class="error-msg" id="lookupError"></div>

    <div class="stock-header" id="stockHeader">
      <div class="sh-top">
        <div class="sh-left">
          <div class="sh-code" id="sh-code"></div>
          <div class="sh-name" id="sh-name"></div>
        </div>
        <div class="sh-right">
          <div class="sh-price" id="sh-price"></div>
          <div class="sh-change" id="sh-change"></div>
        </div>
      </div>
      <div class="sh-bottom">
        <div class="kd-badge" id="kdBadges"></div>
        <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆ 加入最愛</button>
      </div>
    </div>

    <div class="analysis-box" id="analysisBox"></div>
    <div class="chart-wrap" id="chartWrap">
      <div class="chart-title">K線圖 + 費波那契回撤線（近30日真實資料）</div>
      <canvas id="klineChart"></canvas>
      <div class="fib-legend" id="fibLegend"></div>
    </div>
    <div class="stats-row" id="statsRow">
      <div class="stat-item"><div class="stat-label">波段高點</div><div class="stat-val" id="st-high"></div></div>
      <div class="stat-item"><div class="stat-label">波段低點</div><div class="stat-val" id="st-low"></div></div>
      <div class="stat-item"><div class="stat-label">目前回撤</div><div class="stat-val" id="st-retrace"></div></div>
      <div class="stat-item"><div class="stat-label">K / D 值</div><div class="stat-val" id="st-kd"></div></div>
    </div>
  </div>

  <!-- TAB 2 -->
  <div class="tab-content" id="tab-screener">
    <div class="panel">
      <div class="panel-title">▸ 篩選條件</div>
      <div class="filters-grid">
        <div class="field"><label class="field-label">股價下限（元）</label><input type="number" id="s-minPrice" value="10"></div>
        <div class="field"><label class="field-label">股價上限（元）</label><input type="number" id="s-maxPrice" value="500"></div>
      </div>
      <div class="field">
        <label class="field-label">費波那契位置</label>
        <div class="fib-checks" id="fibChecks">
          <span class="fib-btn on" data-val="0.236" onclick="toggleFib(this)">0.236</span>
          <span class="fib-btn on" data-val="0.382" onclick="toggleFib(this)">0.382</span>
          <span class="fib-btn on" data-val="0.5"   onclick="toggleFib(this)">0.500</span>
          <span class="fib-btn on" data-val="0.618" onclick="toggleFib(this)">0.618</span>
          <span class="fib-btn on" data-val="0.786" onclick="toggleFib(this)">0.786</span>
        </div>
      </div>
      <div class="toggle-row">
        <span>KD 低檔確認（KD &lt; 30）</span>
        <label class="toggle"><input type="checkbox" id="s-useKD" checked><span class="toggle-slider"></span></label>
      </div>
      <div class="toggle-row">
        <span>⭐ 只看 KD 黃金交叉</span>
        <label class="toggle"><input type="checkbox" id="s-useGolden"><span class="toggle-slider"></span></label>
      </div>
      <button class="btn btn-primary btn-full" onclick="runScreener()">🔍 開始篩選</button>
    </div>
    <div class="screener-results" id="screenerResults">
      <div class="results-meta">
        <div class="results-label">▸ 篩選結果</div>
        <div class="results-count">找到 <span id="s-count">0</span> 支</div>
      </div>
      <div id="s-list"></div>
      <div class="disclaimer"><strong>⚠ 免責聲明：</strong>資料來自 TWSE，每日收盤後自動更新，僅供參考，不構成投資建議。</div>
    </div>
  </div>

  <!-- TAB 3 -->
  <div class="tab-content" id="tab-favtab">
    <div class="panel">
      <div class="panel-title">▸ 我的最愛</div>
      <div class="fav-list" id="favList"></div>
      <div class="fav-empty" id="favEmpty">還沒有最愛，查詢股票後點「☆ 加入最愛」</div>
    </div>
  </div>
</div>

<script>
const FIB_COLORS={'0':'#888','0.236':'#e91e63','0.382':'#ff9800','0.5':'#ffeb3b','0.618':'#4caf50','0.786':'#2196f3','1':'#888'};
const STOCK_NAMES={
  '0050':'元大台灣50','0056':'元大高股息','00878':'國泰永續高股息','00900':'富邦特選高股息',
  '006208':'富邦台灣50','2330':'台積電','2454':'聯發科','2379':'瑞昱','2303':'聯電',
  '2408':'南亞科','2412':'中華電','2308':'台達電','2317':'鴻海','2382':'廣達',
  '3711':'日月光投控','2357':'華碩','4938':'和碩','3008':'大立光','2345':'智邦',
  '3037':'欣興','4966':'譜瑞-KY','6669':'緯穎','2391':'聯昌','3034':'聯詠',
  '2337':'旺宏','2474':'可成','3045':'台灣大','2352':'佳世達','2324':'仁寶',
  '2376':'技嘉','2301':'光寶科','2354':'鴻準','6505':'台塑化','3231':'緯創',
  '1301':'台塑','1303':'南亞','1326':'台化','2002':'中鋼','1101':'台泥',
  '1216':'統一','2105':'正新','1402':'遠東新','2207':'和泰車','1590':'亞德客-KY',
  '1802':'台玻','1504':'東元','1477':'聚陽','1605':'華新','2395':'研華',
  '2603':'長榮','2609':'陽明','2610':'華航','2615':'萬海','2618':'長榮航',
  '1583':'程泰','1815':'富喬','3443':'創意','5269':'祥碩','6415':'矽力-KY','3149':'正達',
  '2439':'美律','3702':'大聯大','6770':'力積電','2049':'上銀','6547':'高端疫苗',
};

let stocksData={}, favorites=JSON.parse(localStorage.getItem('fav_stocks')||'[]'), currentCode='';

async function loadData(){
  try{
    const res=await fetch('data/stocks.json?t='+Date.now());
    const json=await res.json();
    stocksData=json.stocks||{};
    Object.keys(stocksData).forEach(code=>{stocksData[code].name=STOCK_NAMES[code]||code;});
    document.getElementById('updatedBadge').textContent=json.updated?'更新：'+json.updated:'載入完成';
    renderFavList();
  }catch(e){document.getElementById('updatedBadge').textContent='資料載入失敗';}
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['lookup','screener','favtab'][i]===tab));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}
function toggleFib(el){el.classList.toggle('on');}

function toggleFav(){
  if(!currentCode)return;
  const btn=document.getElementById('favBtn');
  const idx=favorites.indexOf(currentCode);
  if(idx===-1){favorites.push(currentCode);btn.textContent='★ 已加入最愛';btn.classList.add('active');}
  else{favorites.splice(idx,1);btn.textContent='☆ 加入最愛';btn.classList.remove('active');}
  localStorage.setItem('fav_stocks',JSON.stringify(favorites));
  renderFavList();
}
function updateFavBtn(code){
  const btn=document.getElementById('favBtn');
  if(favorites.includes(code)){btn.textContent='★ 已加入最愛';btn.classList.add('active');}
  else{btn.textContent='☆ 加入最愛';btn.classList.remove('active');}
}
function renderFavList(){
  const list=document.getElementById('favList'),empty=document.getElementById('favEmpty');
  list.innerHTML='';
  if(!favorites.length){empty.style.display='';return;}
  empty.style.display='none';
  favorites.forEach(code=>{
    const chip=document.createElement('div');
    chip.className='fav-chip';
    chip.innerHTML=`<span class="fav-chip-code" onclick="quickLookup('${code}')">${code}</span><span class="fav-chip-name" onclick="quickLookup('${code}')">${STOCK_NAMES[code]||code}</span><span class="fav-chip-del" onclick="removeFav('${code}')">×</span>`;
    list.appendChild(chip);
  });
}
function removeFav(code){favorites=favorites.filter(c=>c!==code);localStorage.setItem('fav_stocks',JSON.stringify(favorites));renderFavList();if(currentCode===code)updateFavBtn(code);}
function quickLookup(code){switchTab('lookup');document.getElementById('stockCode').value=code;lookupStock();}

function drawChart(canvas,candles,fibLevels,currentPrice){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth-28;
  const H=Math.min(280,Math.max(200,window.innerHeight*0.32));
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const PAD={top:16,right:46,bottom:24,left:48};
  const cW=W-PAD.left-PAD.right,cH=H-PAD.top-PAD.bottom;
  const allP=candles.flatMap(c=>[c.high,c.low]).concat(fibLevels.map(f=>f.price));
  const minP=Math.min(...allP)*0.998,maxP=Math.max(...allP)*1.002;
  const rng=maxP-minP;
  const toY=p=>PAD.top+cH-((p-minP)/rng)*cH;
  const kw=Math.max(3,Math.floor(cW/candles.length*0.6));
  ctx.fillStyle='#0a0e1a';ctx.fillRect(0,0,W,H);
  // 左側刻度
  for(let i=0;i<=4;i++){
    const y=PAD.top+(cH/4)*i;
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();
    ctx.fillStyle='#5a7a9a';ctx.font="9px 'Share Tech Mono',monospace";ctx.textAlign='right';
    ctx.fillText((maxP-rng/4*i).toFixed(0),PAD.left-3,y+3);
  }
  // 費波那契線
  fibLevels.forEach(f=>{
    const y=toY(f.price);
    const color=FIB_COLORS[String(f.ratio)]||'#aaa';
    ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.5;
    ctx.setLineDash(f.ratio===0||f.ratio===1?[4,4]:[6,3]);ctx.globalAlpha=0.65;
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();ctx.restore();
    const label=f.ratio===0?'高':f.ratio===1?'低':f.ratio.toFixed(3);
    ctx.fillStyle=color;ctx.font="bold 9px 'Share Tech Mono',monospace";ctx.textAlign='left';
    ctx.fillText(label,W-PAD.right+3,y+3);
  });
  // K棒
  candles.forEach((c,i)=>{
    const x=PAD.left+(i/candles.length)*cW+cW/candles.length/2;
    const isUp=c.close>=c.open;
    const color=isUp?'#ef5350':'#26a69a';
    const bTop=toY(Math.max(c.open,c.close)),bBot=toY(Math.min(c.open,c.close));
    ctx.strokeStyle=color;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,toY(c.high));ctx.lineTo(x,toY(c.low));ctx.stroke();
    ctx.fillStyle=color;ctx.fillRect(x-kw/2,bTop,kw,Math.max(1,bBot-bTop));
  });
  // 目前價格（左側標籤）
  const cy=toY(currentPrice);
  ctx.save();ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.moveTo(PAD.left,cy);ctx.lineTo(W-PAD.right,cy);ctx.stroke();ctx.restore();
  ctx.fillStyle='#00d4ff';ctx.fillRect(0,cy-8,PAD.left-3,16);
  ctx.fillStyle='#0a0e1a';ctx.font="bold 8px 'Share Tech Mono',monospace";ctx.textAlign='center';
  ctx.fillText(currentPrice.toFixed(0),(PAD.left-3)/2,cy+3);
  // 日期
  ctx.fillStyle='#5a7a9a';ctx.font="9px 'Share Tech Mono',monospace";ctx.textAlign='center';
  const step=Math.floor(candles.length/4);
  for(let i=0;i<candles.length;i+=step){
    const x=PAD.left+(i/candles.length)*cW+cW/candles.length/2;
    ctx.fillText(candles[i].date.slice(5),x,H-6);
  }
}

function showStock(s){
  currentCode=s.code;
  document.getElementById('sh-code').textContent=s.code;
  document.getElementById('sh-name').textContent=s.name;
  document.getElementById('sh-price').textContent='$'+s.currentPrice.toFixed(2);
  const changeEl=document.getElementById('sh-change');
  changeEl.textContent=(s.change>=0?'+':'')+s.change.toFixed(2)+'%';
  changeEl.className='sh-change '+(s.change>=0?'up':'down');

  // KD 徽章
  const badges=document.getElementById('kdBadges');
  badges.innerHTML='';
  const kdClass=s.k<30?'badge-kd-low':'badge-kd';
  badges.innerHTML+=`<span class="badge ${kdClass}">K ${s.k.toFixed(0)} / D ${s.d.toFixed(0)}</span>`;
  if(s.goldenCross) badges.innerHTML+=`<span class="badge badge-golden">⭐ KD 黃金交叉</span>`;
  else if(s.deathCross) badges.innerHTML+=`<span class="badge badge-death">💀 KD 死亡交叉</span>`;
  else if(s.k<30) badges.innerHTML+=`<span class="badge badge-kd-low">低檔區間</span>`;

  updateFavBtn(s.code);
  document.getElementById('stockHeader').classList.add('show');

  const rng=s.high-s.low;
  const retrace=rng>0?((s.high-s.currentPrice)/rng*100).toFixed(1):'0';
  const hitStr=s.hitFib!==null&&s.hitFib!==undefined?`命中 ${s.hitFib} 支撐位，`:'未命中費波支撐，';
  const abox=document.getElementById('analysisBox');
  abox.textContent=`📊 回撤 ${retrace}%，${hitStr}K=${s.k.toFixed(0)} D=${s.d.toFixed(0)}${s.goldenCross?' ⭐黃金交叉！':''}`;
  abox.classList.add('show');

  document.getElementById('chartWrap').classList.add('show');
  setTimeout(()=>drawChart(document.getElementById('klineChart'),s.candles,s.fibLevels,s.currentPrice),50);

  const legend=document.getElementById('fibLegend');
  legend.innerHTML='';
  s.fibLevels.forEach(f=>{
    const color=FIB_COLORS[String(f.ratio)]||'#aaa';
    const isHit=Math.abs(s.currentPrice-f.price)/f.price*100<1.5;
    const item=document.createElement('div');
    item.className='fib-legend-item';
    item.innerHTML=`<div class="fib-legend-line" style="background:${color}"></div>
      <span class="fib-legend-val" style="color:${color}">${f.ratio===0?'高點':f.ratio===1?'低點':f.ratio.toFixed(3)}</span>
      <span style="${isHit?'color:#00d4ff;font-weight:700':''}">${f.price.toFixed(1)}${isHit?' ◀':''}</span>`;
    legend.appendChild(item);
  });

  document.getElementById('st-high').textContent='$'+s.high.toFixed(1);
  document.getElementById('st-low').textContent='$'+s.low.toFixed(1);
  document.getElementById('st-retrace').textContent=retrace+'%';
  const kdEl=document.getElementById('st-kd');
  kdEl.textContent=s.k.toFixed(0)+'/'+s.d.toFixed(0);
  kdEl.style.color=s.k<30?'#ef5350':s.k>70?'#26a69a':'#fff';
  document.getElementById('statsRow').classList.add('show');
}

function lookupStock(){
  const code=document.getElementById('stockCode').value.trim();
  if(!code)return;
  const error=document.getElementById('lookupError');
  error.classList.remove('show');
  ['stockHeader','chartWrap','statsRow','analysisBox'].forEach(id=>document.getElementById(id).classList.remove('show'));
  const s=stocksData[code];
  if(!s){error.textContent=`❌ 找不到「${code}」，請確認代碼是否在追蹤清單內`;error.classList.add('show');return;}
  showStock(s);
}

function runScreener(){
  const minP=parseFloat(document.getElementById('s-minPrice').value)||10;
  const maxP=parseFloat(document.getElementById('s-maxPrice').value)||500;
  const useKD=document.getElementById('s-useKD').checked;
  const useGolden=document.getElementById('s-useGolden').checked;
  const selectedFibs=[...document.querySelectorAll('#fibChecks .fib-btn.on')].map(b=>parseFloat(b.dataset.val));
  const list=document.getElementById('s-list');
  list.innerHTML='';

  const candidates=Object.values(stocksData).filter(s=>{
    if(s.currentPrice<minP||s.currentPrice>maxP)return false;
    if(useKD&&s.k>=30)return false;
    if(useGolden&&!s.goldenCross)return false;
    if(!useGolden){
      if(s.hitFib===null||s.hitFib===undefined)return false;
      if(!selectedFibs.includes(parseFloat(s.hitFib)))return false;
    }
    return true;
  });

  document.getElementById('s-count').textContent=candidates.length;
  document.getElementById('screenerResults').classList.add('show');

  if(!candidates.length){list.innerHTML='<div class="no-data">🔭 沒有符合條件的股票，試試放寬條件</div>';return;}
  candidates.sort((a,b)=>a.k-b.k);
  candidates.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='screener-card';
    card.style.animationDelay=i*0.04+'s';
    const sign=s.change>=0?'+':'';
    const cc=s.change>=0?'up':'down';
    card.innerHTML=`<div class="sc-top">
      <div class="sc-code">${s.code}</div>
      <div class="sc-info">
        <div class="sc-name">${s.name}</div>
        <div class="sc-tags">
          ${s.hitFib!==null&&s.hitFib!==undefined?`<span class="tag tag-fib">Fib ${s.hitFib}</span>`:''}
          <span class="tag tag-kd">K${s.k.toFixed(0)}/D${s.d.toFixed(0)}</span>
          ${s.goldenCross?'<span class="tag tag-golden">⭐黃金交叉</span>':''}
        </div>
      </div>
      <div class="sc-price">
        <div class="sc-price-val">$${s.currentPrice.toFixed(2)}</div>
        <div class="sc-change ${cc}">${sign}${s.change.toFixed(2)}%</div>
      </div>
    </div>`;
    card.onclick=()=>{switchTab('lookup');document.getElementById('stockCode').value=s.code;lookupStock();};
    list.appendChild(card);
  });
}

document.getElementById('stockCode').addEventListener('keydown',e=>{if(e.key==='Enter')lookupStock();});
loadData();
</script>
